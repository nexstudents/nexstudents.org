<!doctype html>
<html><head><meta charset="utf-8"><title>Mobile harness</title>
<style>
  body{margin:0;background:#2a2a2e;font:13px -apple-system,Segoe UI,sans-serif;color:#ddd;
       display:flex;gap:26px;padding:18px;align-items:flex-start}
  figure{margin:0;display:flex;flex-direction:column;gap:8px;align-items:center}
  figcaption{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px;color:#9a9aa2}
  iframe{border:0;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.5);border-radius:10px}
</style></head>
<body>
  <!-- An iframe establishes its own viewport, so the page inside it evaluates
       its media queries against THESE dimensions. This is a real mobile render,
       not a scaled-down desktop screenshot. -->
  <figure>
    <iframe src="http://localhost:8094/_v8.html?m=1" width="390" height="740"></iframe>
    <figcaption>iPhone 390 &times; 740</figcaption>
  </figure>
  <figure>
    <iframe src="http://localhost:8094/_v8.html?m=2" width="320" height="740"></iframe>
    <figcaption>Small 320 &times; 740</figcaption>
  </figure>
  <figure>
    <iframe src="http://localhost:8094/_v8.html?m=3" width="768" height="740"></iframe>
    <figcaption>Tablet 768 &times; 740</figcaption>
  </figure>
</body></html>
