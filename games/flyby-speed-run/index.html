<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlyBy Speed Run — NexStudents</title>
<link rel="canonical" href="https://nexstudents.org/games/flyby-speed-run/">
<meta name="description" content="A timed multiplication drill. Pick your tables, answer against the clock, and earn your rank.">
<!--
  Ported from paulspies/kolten-quizzes "Multiplication Timer.html" on 2026-08-28.
  Paul wrote the original; this keeps its shape and its best idea - the Air Force
  rank ladder, which suits Kolten's USAF goal - and adds the three things it was
  missing.

  🚨 THE TABLE PICKER IS THE REAL ADDITION. The original always drew from the
  whole 1-12 grid, which makes it a test rather than a drill: you cannot work on
  the sevens if the sevens are one question in twelve. The same repo held four
  separate files - Multiplication 4s, 5s, 6s, 7s - which is that same gap solved
  by copying the file four times. One picker replaces all four, and any
  combination beyond them.

  Also added: a score that persists, and the site's theme so it does not look
  like it wandered in from another website.
-->
<style>
  :root{
    --bg:#12161b; --panel:#1a2027; --line:#2b3540; --fg:#eef2f6; --dim:#93a1b0;
    --a:#5b9cf6; --ok:#4ade80; --warn:#e8a33d; --bad:#e63946;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%}
  body{background:var(--bg);color:var(--fg);
       font:16px/1.6 "Segoe UI",system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;padding:0 16px 40px}

  .bar{width:100%;max-width:560px;display:flex;align-items:center;gap:12px;
       padding:14px 0;font-size:.85rem}
  .bar a{color:var(--dim);text-decoration:none}
  .bar a:hover{color:var(--fg)}
  .bar .sp{flex:1}

  h1{font-size:1.5rem;letter-spacing:-.02em;margin:6px 0 2px;text-align:center}
  .sub{color:var(--dim);font-size:.88rem;margin:0 0 20px;text-align:center}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;
        padding:26px;width:100%;max-width:560px;text-align:center}
  .card + .card{margin-top:14px}
  .hide{display:none!important}

  /* the setup */
  fieldset{border:0;padding:0;margin:0 0 18px}
  legend{font-size:.72rem;letter-spacing:.13em;text-transform:uppercase;
         color:var(--dim);font-weight:800;margin-bottom:9px}
  .tables{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
  .tables label{position:relative}
  .tables input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
  .tables span{display:grid;place-items:center;height:44px;border-radius:10px;
    border:1px solid var(--line);background:#12171d;font-weight:800;
    font-variant-numeric:tabular-nums;transition:background .15s,border-color .15s}
  .tables input:checked + span{background:var(--a);border-color:var(--a);color:#08203f}
  .tables input:focus-visible + span{outline:2px solid var(--fg);outline-offset:2px}
  .quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
  .opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  select,button{font:inherit;font-size:.85rem;cursor:pointer;border-radius:999px;
    border:1px solid var(--line);background:#12171d;color:var(--dim);padding:7px 14px}
  button:hover,select:hover{color:var(--fg);border-color:var(--dim)}
  .go{background:var(--a);border-color:var(--a);color:#08203f;font-weight:800;
      padding:13px 34px;font-size:1rem;margin-top:6px}
  .go:hover{filter:brightness(1.08);color:#08203f}

  /* the drill */
  .clock{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;
         letter-spacing:-.02em;transition:color .3s}
  .clock.warn{color:var(--warn)} .clock.danger{color:var(--bad)}
  .count{font-size:.82rem;color:var(--dim);margin-bottom:14px}
  .track{background:#12171d;border-radius:20px;height:6px;margin-bottom:22px;overflow:hidden}
  .fill{height:100%;background:var(--a);border-radius:20px;transition:width .3s ease}
  .sum{font-size:3rem;font-weight:800;letter-spacing:2px;margin-bottom:14px;
       font-variant-numeric:tabular-nums}
  .flash{font-size:1.05rem;font-weight:700;min-height:26px;margin-bottom:10px}
  .flash.ok{color:var(--ok)} .flash.no{color:var(--bad)}
  input[type=number]{width:100%;background:#12171d;border:2px solid var(--line);
    border-radius:12px;padding:15px 18px;font:800 1.9rem/1 inherit;color:var(--fg);
    text-align:center;outline:none;-moz-appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]:focus{border-color:var(--a)}
  .tip{font-size:.78rem;color:var(--dim);margin-top:9px}

  /* the debrief */
  .score{font-size:3rem;font-weight:800;margin:8px 0 4px;font-variant-numeric:tabular-nums}
  .line{color:var(--dim);font-size:.9rem}
  .rank{display:inline-block;border:1px solid var(--a);color:var(--a);
        border-radius:999px;padding:7px 18px;margin:16px 0 4px;font-weight:800}
  table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:16px}
  td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
  td.t{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  tr.me td{color:var(--ok)}
  .missed{margin-top:16px;font-size:.85rem;color:var(--dim);line-height:1.9}
  .missed b{color:var(--fg);background:#12171d;border:1px solid var(--line);
            border-radius:8px;padding:3px 8px;font-variant-numeric:tabular-nums;
            display:inline-block;margin:0 3px}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  @media(max-width:420px){ .tables{grid-template-columns:repeat(4,1fr)} }
</style>
</head>
<body>

<div class="bar">
  <a href="/games/">&larr; Games</a>
  <span class="sp"></span>
  <a href="/">NexStudents</a>
</div>

<h1>FlyBy Speed Run</h1>
<p class="sub">Multiplication against the clock. Pick your tables and earn your rank.</p>

<!-- setup -->
<div class="card" id="setup">
  <fieldset>
    <legend>Which tables</legend>
    <div class="tables" id="tables"></div>
    <div class="quick">
      <button type="button" data-pick="all">All</button>
      <button type="button" data-pick="none">None</button>
      <button type="button" data-pick="hard">The tricky ones</button>
    </div>
  </fieldset>

  <fieldset>
    <legend>How long, how many</legend>
    <div class="opts">
      <select id="mins" aria-label="Time limit">
        <option value="120">2 minutes</option>
        <option value="180">3 minutes</option>
        <option value="300" selected>5 minutes</option>
        <option value="600">10 minutes</option>
      </select>
      <select id="count" aria-label="Number of problems">
        <option value="20">20 problems</option>
        <option value="30">30 problems</option>
        <option value="50" selected>50 problems</option>
      </select>
    </div>
  </fieldset>

  <button class="go" id="start" type="button">Begin Mission</button>
  <p class="tip" id="setupTip">Type the answer and press Enter.</p>
</div>

<!-- drill -->
<div class="card hide" id="drill">
  <div class="clock" id="clock">5:00</div>
  <div class="count" id="count-txt">Problem 1 of 50</div>
  <div class="track"><div class="fill" id="fill" style="width:0"></div></div>
  <div class="sum" id="sum">7 &times; 8 =</div>
  <div class="flash" id="flash"></div>
  <input type="number" id="answer" placeholder="?" autocomplete="off"
         inputmode="numeric" aria-label="Your answer">
  <p class="tip">Press Enter to submit</p>
</div>

<!-- debrief -->
<div class="card hide" id="debrief">
  <h2 style="margin:0;font-size:1.15rem">Mission Debrief</h2>
  <div class="score" id="score"></div>
  <p class="line" id="detail"></p>
  <div class="rank" id="rank"></div>
  <div class="missed hide" id="missed"></div>
  <table id="board"></table>
  <p></p>
  <button class="go" id="again" type="button">Fly Again</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const KEY = "ns:flyby:best";

/* ── setup ─────────────────────────────────────────────────────────────── */
const TABLES = $("tables");
for (let n = 1; n <= 12; n++) {
  const l = document.createElement("label");
  l.innerHTML = '<input type="checkbox" value="' + n + '"' +
    (n >= 2 ? " checked" : "") + '><span>' + n + "</span>";
  TABLES.appendChild(l);
}
const picked = () => [...TABLES.querySelectorAll("input:checked")].map(i => +i.value);

document.querySelectorAll("[data-pick]").forEach(b => {
  b.onclick = () => {
    const how = b.dataset.pick;
    TABLES.querySelectorAll("input").forEach(i => {
      const n = +i.value;
      /* the tricky ones are the tables children actually stumble on - the small
         ones are mostly counting, and 10 is a rule rather than a fact */
      i.checked = how === "all" ? true : how === "none" ? false : [6,7,8,9,12].includes(n);
    });
  };
});

/* ── state ─────────────────────────────────────────────────────────────── */
let problems = [], at = 0, right = 0, wrong = 0, missed = [];
let left = 300, total = 300, timer = 0, size = 50;

const mmss = (s) => Math.floor(s / 60) + ":" + String(Math.max(0, s % 60)).padStart(2, "0");

function build() {
  const t = picked();
  const pool = [];
  /* every fact from the chosen tables, both ways round - 7x8 and 8x7 are the
     same fact but they do not feel the same to a child, so both are asked */
  t.forEach(a => { for (let b = 1; b <= 12; b++) { pool.push([a, b]); pool.push([b, a]); } });
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  /* de-duplicate so a short run does not ask the same fact twice */
  const seen = new Set(), out = [];
  for (const [a, b] of pool) {
    const k = a + "x" + b;
    if (seen.has(k)) continue;
    seen.add(k); out.push([a, b]);
    if (out.length >= size) break;
  }
  return out;
}

$("start").onclick = () => {
  if (!picked().length) { $("setupTip").textContent = "Pick at least one table first."; return; }
  size = +$("count").value;
  total = left = +$("mins").value;
  problems = build();
  size = problems.length;
  at = 0; right = 0; wrong = 0; missed = [];
  $("setup").classList.add("hide");
  $("debrief").classList.add("hide");
  $("drill").classList.remove("hide");
  $("clock").className = "clock";
  show();
  $("answer").focus();
  clearInterval(timer);
  timer = setInterval(tick, 1000);
};

function tick() {
  left--;
  $("clock").textContent = mmss(left);
  $("clock").className = "clock" + (left <= 30 ? " danger" : left <= 60 ? " warn" : "");
  if (left <= 0) { clearInterval(timer); end(); }
}

function show() {
  if (at >= problems.length) { clearInterval(timer); return end(); }
  const [a, b] = problems[at];
  $("sum").innerHTML = a + " &times; " + b + " =";
  $("count-txt").textContent = "Problem " + (at + 1) + " of " + problems.length;
  $("fill").style.width = (at / problems.length) * 100 + "%";
  $("answer").value = "";
  $("flash").textContent = "";
  $("flash").className = "flash";
  $("clock").textContent = mmss(left);
}

$("answer").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const v = parseInt($("answer").value, 10);
  if (isNaN(v)) return;
  const [a, b] = problems[at];
  const f = $("flash");
  if (v === a * b) { right++; f.textContent = "Correct"; f.className = "flash ok"; }
  else {
    wrong++; missed.push([a, b]);
    f.innerHTML = a + " &times; " + b + " = " + (a * b);
    f.className = "flash no";
  }
  at++;
  setTimeout(show, 380);
});

/* ── debrief ───────────────────────────────────────────────────────────── */
function end() {
  $("drill").classList.add("hide");
  $("debrief").classList.remove("hide");
  const done = right + wrong;
  const pct = done ? Math.round((right / done) * 100) : 0;
  $("score").textContent = right + " / " + done + "  ·  " + pct + "%";
  $("score").style.color = pct >= 80 ? "var(--ok)" : pct >= 60 ? "var(--warn)" : "var(--bad)";
  $("detail").textContent = wrong + (wrong === 1 ? " missed" : " missed") +
    "  ·  " + (left > 0 ? mmss(left) + " left on the clock" : "time ran out") +
    (done < problems.length ? "  ·  " + (problems.length - done) + " not reached" : "");

  /* the rank ladder is the best thing in the original and it stays */
  const RANKS = [[90, "Pilot"], [76, "Officer"], [61, "Airman"], [41, "Cadet"], [0, "Recruit"]];
  $("rank").textContent = RANKS.find(r => pct >= r[0])[1];

  /* 🚨 WHAT YOU GOT WRONG IS THE POINT. A score tells you how you did; the list
     tells you what to practise. The original showed each wrong answer for a
     moment and then lost it. */
  if (missed.length) {
    $("missed").classList.remove("hide");
    $("missed").innerHTML = "Worth another look: " +
      missed.map(([a, b]) => "<b>" + a + " × " + b + " = " + a * b + "</b>").join(" ");
  } else $("missed").classList.add("hide");

  save(pct, right, done);
}

/* ⚠️ localStorage: this device only. A shared board needs a backend the site
   does not have yet. */
const read = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; }
  catch (e) { return []; } };
function save(pct, r, done) {
  const row = { p: pct, r, d: done, t: picked().join(","), when: Date.now() };
  let rows = read().concat([row]).sort((a, b) => b.p - a.p || b.r - a.r).slice(0, 5);
  try { localStorage.setItem(KEY, JSON.stringify(rows)); } catch (e) {}
  $("board").innerHTML = rows.map(x =>
    '<tr class="' + (x.when === row.when ? "me" : "") + '"><td>' + x.p + "%</td>" +
    "<td>" + x.r + " of " + x.d + "</td>" +
    '<td class="t">tables ' + (x.t.length > 14 ? "1–12" : x.t) + "</td></tr>").join("");
}

$("again").onclick = () => {
  $("debrief").classList.add("hide");
  $("setup").classList.remove("hide");
  $("setupTip").textContent = "Type the answer and press Enter.";
};
</script>
</body>
</html>
