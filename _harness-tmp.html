<!doctype html><meta charset="utf-8"><title>Mobile harness</title>
<style>
 body{margin:0;background:#111;color:#ddd;font:13px system-ui;display:flex;gap:14px;padding:12px;align-items:flex-start}
 figure{margin:0}
 figcaption{padding:4px 0;letter-spacing:.08em;text-transform:uppercase;font-size:11px;color:#8b93a1}
 iframe{border:1px solid #333;background:#000;height:720px}
</style>
<figure><figcaption>390 iPhone</figcaption><iframe id="a" width="390" src="about:blank"></iframe></figure>
<figure><figcaption>320 small</figcaption><iframe id="b" width="320" src="about:blank"></iframe></figure>
<figure><figcaption>768 tablet</figcaption><iframe id="c" width="768" src="about:blank"></iframe></figure>
<script>
 var u = new URLSearchParams(location.search).get("u") || "/";
 ["a","b","c"].forEach(function(id){ document.getElementById(id).src = u; });
</script>
