<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Show Me The States — NexStudents</title>
<!--
  GENERATED by tools/games/build-states-game.js. Edit the TEMPLATE beside the
  builder, never this output. Shapes are CC0 US Census boundaries; capital stars
  are projected to match them and verified at build time.

  ── THE LOOP, redesigned 2026-08-28 ────────────────────────────────────────
  ONE STATE AT A TIME. The next arrives once the current one lands. Paul: "i
  think if they have it work more like tetris that you get one right after you
  drop one in place."

  🚨 WHY THAT BEATS THE PILE, and it is not tidiness: a pile lets you
  cherry-pick. You scan it, take the one you recognise and defer the rest - so
  the states you do NOT know, the only ones worth practising, are the ones you
  never have to face. One at a time removes the escape. It also disposes of the
  pile's own problems: nothing stacks, nothing pops in over anything else, and
  there is no hunting through overlapping grey shapes.

  The clock is no longer a spawn timer. It is the SCORE.

  HOT AND COLD, Gemini's idea via Paul: the piece you carry warms as it nears
  home. That is the honest middle between showing the answer and showing
  nothing - it rewards a guess in the right direction without naming the spot.

  ROUND TWO IS THE CAPITALS. Same map, drop a star on each capital.
-->
<style>
  :root{
    --bg:#12161b; --panel:#1a2027; --line:#2b3540; --fg:#eef2f6; --dim:#93a1b0;
    --slot:#1f2937; --edge:#33414f; --ok:#4ade80; --star:#facc15;
    --NE:#5b9cf6; --MW:#43c98a; --S:#e8a33d; --W:#a884e8;
    /* the thermal ramp: cold blue, through yellow and orange, to red at
       home. Paul, 2026-08-28 - and he is right that green is wrong for this:
       people read a temperature scale, and nothing on it is green. */
    --t0:#2f6fb5; --t1:#cfe3f2; --t2:#f7ecb0; --t3:#f2d13b;
    --t4:#f2870d; --t5:#e63946;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{background:var(--bg);color:var(--fg);
       font:16px/1.5 "Segoe UI",system-ui,sans-serif;
       display:flex;flex-direction:column;overflow:hidden;
       user-select:none;-webkit-user-select:none}

  header{padding:9px 14px;flex:none;display:flex;align-items:center;gap:13px;
         border-bottom:1px solid var(--line);flex-wrap:wrap}
  h1{margin:0;font-size:.95rem;letter-spacing:-.02em;flex:none}
  .clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.45rem;
         flex:none;min-width:5ch}
  .stat{color:var(--dim);font-size:.8rem;flex:none}
  .stat b{color:var(--fg);font-variant-numeric:tabular-nums}
  .spacer{flex:1}
  .legend{display:flex;gap:9px;font-size:.7rem;color:var(--dim)}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;
            margin-right:4px;vertical-align:-1px}
  button,select{font:inherit;font-size:.8rem;cursor:pointer;border-radius:999px;
    border:1px solid var(--line);background:#12171d;color:var(--dim);padding:5px 12px}
  button:hover{color:var(--fg);border-color:var(--dim)}
  button.go{background:var(--ok);border-color:var(--ok);color:#08301a;
            font-weight:800;padding:7px 20px;font-size:.88rem}

  #wrap{flex:1;min-height:0;display:flex}
  #board{flex:1;min-width:0;position:relative;touch-action:none}
  #map{width:100%;height:100%;display:block}

  #nation{fill:none;stroke:#3a4a5c;stroke-width:1.6;stroke-linejoin:round}
  .slot{fill:var(--slot);stroke:var(--edge);stroke-width:.7}
  .slot.hot{fill:#3a2b2b;stroke:var(--t4);stroke-width:1.8}
  .done{stroke:#0f141a;stroke-width:.8}
  .done.NE{fill:var(--NE)} .done.MW{fill:var(--MW)}
  .done.S{fill:var(--S)}   .done.W{fill:var(--W)}
  .lbl{fill:#fff;font-weight:700;text-anchor:middle;pointer-events:none;
       paint-order:stroke;stroke:#0f141a;stroke-width:2.4px;stroke-linejoin:round}
  .cap{fill:#101820;text-anchor:middle;pointer-events:none;font-weight:600}
  .star{fill:var(--star);pointer-events:none}

  /* ── THE NEXT PIECE ───────────────────────────────────────────────────
     One at a time, drawn at the MAP's scale so it is exactly the size of the
     hole it fills. Matching a piece to a gap by eye is most of how a jigsaw
     gets solved, and that only works if the sizes agree. */
  #next{flex:none;width:250px;background:var(--panel);border-left:1px solid var(--line);
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:12px;padding:16px;touch-action:none;position:relative}
  #next h2{margin:0;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
           color:var(--dim);font-weight:800;position:absolute;top:10px;left:14px}
  .piece{touch-action:none;cursor:grab;will-change:transform;
         filter:drop-shadow(0 6px 12px rgba(0,0,0,.55));
         display:grid;place-items:center;min-width:54px;min-height:54px}
  .piece svg{overflow:visible;pointer-events:none;width:auto;height:auto}
  .piece path{fill:#7e91a6;stroke:#fff;stroke-width:1.3;stroke-linejoin:round;
              vector-effect:non-scaling-stroke;transition:fill .12s linear}
  .piece:active{cursor:grabbing}
  /* it settles in rather than dropping on top of anything - there is nothing
     underneath it to drop onto any more */
  .piece.in{animation:settle .34s cubic-bezier(.2,.9,.3,1)}
  @keyframes settle{from{transform:scale(.72);opacity:0}}
  .flying{position:fixed;left:0;top:0;z-index:99;pointer-events:none}
  #hint{color:var(--dim);font-size:.8rem;text-align:center;min-height:2.4em}
  #hint b{color:var(--fg)}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
         background:#1f2933;border:1px solid var(--line);padding:7px 15px;
         border-radius:999px;font-size:.84rem;opacity:0;transition:opacity .2s;
         pointer-events:none;white-space:nowrap;z-index:60}
  .toast.show{opacity:1}

  .veil{position:fixed;inset:0;background:rgba(10,13,17,.84);display:grid;
        place-items:center;z-index:80}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:24px 28px;max-width:400px;width:calc(100% - 40px);text-align:center}
  .card h2{margin:0 0 6px;font-size:1.2rem}
  .card p{margin:0 0 16px;color:var(--dim);font-size:.86rem}
  .big{font-size:2.5rem;font-weight:800;font-variant-numeric:tabular-nums;margin:4px 0}
  .initials{display:flex;gap:8px;justify-content:center;margin:12px 0 16px}
  .initials input{width:52px;height:60px;text-align:center;font:800 1.9rem/1 inherit;
    text-transform:uppercase;background:#12171d;color:var(--fg);
    border:1px solid var(--line);border-radius:10px}
  .initials input:focus{outline:none;border-color:var(--ok)}
  table{width:100%;border-collapse:collapse;font-size:.86rem}
  td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
  td.t{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  tr.me td{color:var(--ok)}
  .hide{display:none!important}
  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media(max-width:760px){ #next{width:172px} .legend{display:none} }
</style>
</head>
<body>

<header>
  <h1>Show Me The States</h1>
  <span class="clock" id="clock">0:00</span>
  <span class="stat" id="round">Round 1 &middot; states</span>
  <span class="stat">done <b id="got">0</b>/<b id="tot">0</b></span>
  <span class="spacer"></span>
  <span class="legend" aria-hidden="true">
    <span><i style="background:var(--NE)"></i>NE</span>
    <span><i style="background:var(--MW)"></i>MW</span>
    <span><i style="background:var(--S)"></i>S</span>
    <span><i style="background:var(--W)"></i>W</span>
  </span>
  <select id="level" aria-label="Difficulty">
    <option value="easy">Easy &middot; outlines, warm and cold</option>
    <option value="medium" selected>Medium &middot; ghost outlines</option>
    <option value="hard">Hard &middot; no outlines at all</option>
  </select>
  <button id="mute" type="button" aria-pressed="true">Voice off</button>
  <button id="board-btn" type="button">Leaderboard</button>
  <button class="go" id="start" type="button">Start</button>
</header>

<div id="wrap">
  <div id="board">
    <svg id="map" viewBox="0 0 975 610" preserveAspectRatio="xMidYMid meet">
      <path id="nation" d="__NATION__"></path>
      <g id="slots"></g>
      <g id="marks"></g>
    </svg>
  </div>
  <aside id="next">
    <h2>Next</h2>
    <div id="holder"></div>
    <p id="hint">Press Start.</p>
  </aside>
</div>

<div class="toast" id="toast"></div>

<div class="veil hide" id="done-v">
  <div class="card">
    <h2 id="done-h">Finished.</h2>
    <div class="big" id="finaltime">0:00</div>
    <p id="verdict">&nbsp;</p>
    <div class="initials" id="ini">
      <input maxlength="1" aria-label="First initial">
      <input maxlength="1" aria-label="Second initial">
      <input maxlength="1" aria-label="Third initial">
    </div>
    <button class="go" id="save" type="button">Put me on the board</button>
  </div>
</div>

<div class="veil hide" id="lb-v">
  <div class="card">
    <h2>Leaderboard</h2>
    <p>Fastest full runs on this device.</p>
    <table id="lb"></table>
    <p></p>
    <button id="lb-close" type="button">Close</button>
  </div>
</div>

<script>
const STATES = __STATES__;

/* 🚨 THE THREE LEVELS. `ghost` is how visible an unplaced outline is and it is
   the real difficulty dial: full outlines make this shape-matching, no outlines
   make it recall. `warm` is the hot-and-cold help. */
const LEVELS = {
  easy:   { ghost: 1,    warm: true,  caps: false },
  medium: { ghost: 0.16, warm: true,  caps: true  },
  /* ⚠️ Warm and cold stays ON for Hard. Paul, 2026-08-28: "i think the color
     temp should still be a thing on hard i think it helps." He is right, and it
     does not make Hard easy - with no outlines the temperature is the ONLY
     feedback there is, so Hard becomes pure positional recall guided by warmth
     rather than a shape-matching exercise. Turning it off just made Hard
     tedious, which is a different thing from difficult. */
  hard:   { ghost: 0,    warm: true,  caps: true  },
};
const LB_KEY = "ns:states:leaderboard";

const NS = "http://www.w3.org/2000/svg";
const el = (n, a) => { const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };
const $ = (id) => document.getElementById(id);

const map = $("map"), slotG = $("slots"), markG = $("marks"), holder = $("holder");
let slots = {}, queue = [], got = 0, streak = 0, t0 = 0, tick = 0;
let running = false, phase = 1, lv = LEVELS.medium, current = null;

const total = () => STATES.length * (lv.caps ? 2 : 1);
const mmss = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
const mapScale = () => {
  const r = map.getBoundingClientRect(), vb = map.viewBox.baseVal;
  return Math.min(r.width / vb.width, r.height / vb.height);
};

function reset() {
  clearInterval(tick);
  lv = LEVELS[$("level").value] || LEVELS.medium;
  slotG.textContent = ""; markG.textContent = ""; holder.textContent = "";
  slots = {}; got = 0; streak = 0; phase = 1; running = false; current = null;
  $("got").textContent = "0"; $("tot").textContent = total();
  $("clock").textContent = "0:00"; $("round").textContent = "Round 1 · states";
  $("hint").textContent = "Press Start.";
  map.style.cursor = "";
  STATES.forEach(s => {
    const p = el("path", { d: s.d, class: "slot" });
    p.style.opacity = lv.ghost;
    slotG.appendChild(p); slots[s.n] = p;
  });
  queue = STATES.slice().sort(() => Math.random() - 0.5);
}
reset();
$("level").onchange = () => { reset(); $("start").textContent = "Start"; };

function begin() {
  reset(); running = true; t0 = Date.now();
  $("start").textContent = "Restart";
  tick = setInterval(() => {
    $("clock").textContent = mmss(Math.floor((Date.now() - t0) / 1000));
  }, 200);
  deal();
}
$("start").onclick = begin;

/* ── one at a time ────────────────────────────────────────────────────── */
function deal() {
  holder.textContent = "";
  current = queue.shift();
  if (!current) return nextPhase();
  const s = current, K = mapScale();
  const box = document.createElement("div");
  box.className = "piece in";
  box.dataset.n = s.n;
  if (phase === 1) {
    const w = (s.b[2] - s.b[0]) * K, h = (s.b[3] - s.b[1]) * K;
    const svg = el("svg", { viewBox: s.b[0] + " " + s.b[1] + " " +
      (s.b[2] - s.b[0]) + " " + (s.b[3] - s.b[1]) });
    svg.style.width = w + "px"; svg.style.height = h + "px";
    svg.appendChild(el("path", { d: s.d }));
    box.appendChild(svg);
    $("hint").innerHTML = lv.ghost
      ? "Drop it where it belongs."
      : "No outlines.<br>Follow the warmth.";
  } else {
    const svg = el("svg", { viewBox: "0 0 40 40" });
    svg.style.width = "56px"; svg.style.height = "56px";
    svg.appendChild(el("path", { d: star(20, 20, 17), class: "star" }));
    box.appendChild(svg);
    $("hint").innerHTML = "Where is the capital of<br><b>" + s.n + "</b>?";
  }
  holder.appendChild(box);
  setTimeout(() => box.classList.remove("in"), 360);
}

function nextPhase() {
  if (phase === 1 && lv.caps) {
    phase = 2;
    queue = STATES.slice().sort(() => Math.random() - 0.5);
    $("round").textContent = "Round 2 · capitals";
    say("<b>Round two</b> &middot; now the capitals");
    deal();
    return;
  }
  finish();
}

/* ── drag ─────────────────────────────────────────────────────────────── */
let drag = null, raf = 0;

$("next").addEventListener("pointerdown", (e) => {
  const piece = e.target.closest(".piece");
  if (!piece || drag || !running) return;
  e.preventDefault();
  const r = piece.getBoundingClientRect();
  const fly = piece.cloneNode(true);
  fly.className = "piece flying";
  fly.style.width = r.width + "px"; fly.style.height = r.height + "px";
  document.body.appendChild(fly);
  drag = { from: piece, fly, path: fly.querySelector("path"),
    dx: e.clientX - r.left, dy: e.clientY - r.top,
    x: r.left, y: r.top, w: r.width, h: r.height,
    mapRect: map.getBoundingClientRect(), vb: map.viewBox.baseVal };
  piece.style.visibility = "hidden";
  paint();
  $("next").setPointerCapture(e.pointerId);
});

$("next").addEventListener("pointermove", (e) => {
  if (!drag) return;
  drag.x = e.clientX - drag.dx; drag.y = e.clientY - drag.dy;
  if (!raf) raf = requestAnimationFrame(paint);
});

function toMap(cx, cy) {
  const r = drag.mapRect, vb = drag.vb;
  const k = Math.min(r.width / vb.width, r.height / vb.height);
  return [(cx - (r.left + (r.width - vb.width * k) / 2)) / k + vb.x,
          (cy - (r.top + (r.height - vb.height * k) / 2)) / k + vb.y];
}
const target = () => (phase === 1 ? current.m : current.s);
const tolerance = () => {
  if (phase === 2) return 26;
  const w = current.b[2] - current.b[0], h = current.b[3] - current.b[1];
  return Math.max(46, Math.min(w, h) * 1.05);
};
const distance = () => {
  const c = toMap(drag.x + drag.w / 2, drag.y + drag.h / 2), t = target();
  return Math.hypot(c[0] - t[0], c[1] - t[1]);
};

/* 🚨 HOT AND COLD. The piece warms as it nears home: cold blue far off, amber
   close, green once it will land. It rewards a guess in the right direction
   without ever naming the spot, which is what makes it a teaching aid rather
   than an answer key. Off on Hard. */
const rgb = (h) => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const mix = (a, b, t) => "#" + rgb(a).map((v, i) =>
  Math.round(v + (rgb(b)[i] - v) * t).toString(16).padStart(2, "0")).join("");

/* 🚨 A FOUR-STOP RAMP, not a two-colour blend. Blue straight to red passes
   through mud - purples and browns that read as nothing. Going by way of
   yellow and orange is what makes it legible as a TEMPERATURE, which is the
   whole point of hot and cold. The stops are bunched near the top because the
   last stretch is where the feedback has to be sharpest. */
/* ⚠️ It goes through PALE, not straight from blue to yellow. A direct blend
   passes through sage green - measured #889c7e at a quarter of the way - and
   green is the one colour that does not belong on a temperature scale. Routing
   it through a pale blue and a pale cream keeps every step legible as "cooler"
   or "warmer" and never lands on green. */
const RAMP = [[0, "--t0"], [0.40, "--t1"], [0.55, "--t2"],
              [0.72, "--t3"], [0.86, "--t4"], [1, "--t5"]];
function heat(t) {
  t = Math.max(0, Math.min(1, t));
  for (let i = 1; i < RAMP.length; i++) {
    if (t <= RAMP[i][0]) {
      const [p0, c0] = RAMP[i - 1], [p1, c1] = RAMP[i];
      return mix(cssv(c0), cssv(c1), (t - p0) / (p1 - p0));
    }
  }
  return cssv("--t5");
}
const cssv = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function paint() {
  raf = 0; if (!drag) return;
  drag.fly.style.transform =
    "translate3d(" + drag.x + "px," + drag.y + "px,0) scale(1.05)";
  const d = distance(), tol = tolerance(), hit = d <= tol;
  if (phase === 1) {
    for (const n in slots) slots[n].classList.toggle("hot", hit && n === current.n);
  }
  if (lv.warm && drag.path) {
    /* 260 map units is about a third of the country; past that it is simply
       cold, and inside it the warmth is signal rather than noise */
    /* 🚨 FULL RED MEANS DEAD ON, not merely close enough to snap. Paul,
       2026-08-28: "it need to be right on top to be fully red but a deep orange
       if its right next to it." The snap tolerance is deliberately generous, so
       treating anywhere inside it as red threw away the last and most useful
       part of the signal - the bit that tells you whether you actually know
       where the state goes or just got near. Inside the snap zone the colour
       still climbs, from deep orange at the edge to red at the exact spot. */
    /* The snap zone is DEEP ORANGE nearly all the way across. Red is held back
       for the middle fifth of it - "right on top" - because that is the only
       part that tells you whether you knew where the state went or merely got
       near enough for a generous snap to rescue you. */
    const EDGE = 0.86;                   /* deep orange */
    const BAND = 0.90;                   /* orange-red, just inside the zone */
    const NEAR = tol * 0.2;              /* dead on */
    const t = d <= NEAR ? 1
      : d <= tol ? EDGE + (BAND - EDGE) * (1 - (d - NEAR) / (tol - NEAR))
      : Math.max(0, EDGE * (1 - (d - tol) / 260));
    drag.path.style.fill = heat(t);
  }
}

$("next").addEventListener("pointerup", (e) => {
  if (!drag) return;
  drag.x = e.clientX - drag.dx; drag.y = e.clientY - drag.dy;
  const ok = distance() <= tolerance();
  const d = drag; drag = null;
  for (const n in slots) slots[n].classList.remove("hot");
  if (ok) land(d); else { streak = 0; goBack(d); }
});
$("next").addEventListener("pointercancel", () => { if (drag) { goBack(drag); drag = null; } });

function land(d) {
  const s = current, r = d.mapRect, vb = d.vb;
  const k = Math.min(r.width / vb.width, r.height / vb.height);
  const t = target();
  const tx = r.left + (r.width - vb.width * k) / 2 + (t[0] - vb.x) * k - d.w / 2;
  const ty = r.top + (r.height - vb.height * k) / 2 + (t[1] - vb.y) * k - d.h / 2;
  d.fly.style.transition = "transform .18s cubic-bezier(.2,.8,.3,1), opacity .18s .05s";
  d.fly.style.transform = "translate3d(" + tx + "px," + ty + "px,0) scale(1)";
  d.fly.style.opacity = "0";
  setTimeout(() => d.fly.remove(), 250);
  d.from.remove();

  const w = s.b[2] - s.b[0], h = s.b[3] - s.b[1];
  const size = Math.max(6, Math.min(13, Math.min(w, h) * 0.30));
  if (phase === 1) {
    slots[s.n].setAttribute("class", "done " + (s.r || ""));
    slots[s.n].style.opacity = "";
    slots[s.n].dataset.n = s.n;
    const t1 = el("text", { class: "lbl", x: s.m[0], y: s.m[1] - 1, "font-size": size });
    t1.textContent = s.n;
    markG.appendChild(t1);
    speak(s.n);
  } else {
    markG.appendChild(el("path", { class: "star", d: star(s.s[0], s.s[1], size * 0.5) }));
    const t2 = el("text", { class: "cap", x: s.m[0], y: s.m[1] + size * 1.05,
      "font-size": size * 0.78 });
    t2.textContent = s.c;
    markG.appendChild(t2);
    speak(s.c + ", capital of " + s.n);
  }

  got++; streak++;
  $("got").textContent = got;
  say("<b>" + s.n + "</b>" + (phase === 2 ? " &middot; " + s.c : "") +
      (streak >= 4 ? " &middot; " + streak + " in a row" : ""));
  deal();
}

function goBack(d) {
  const r = d.from.getBoundingClientRect();
  d.fly.style.transition = "transform .22s cubic-bezier(.3,.9,.3,1)";
  d.fly.style.transform = "translate3d(" + r.left + "px," + r.top + "px,0) scale(1)";
  setTimeout(() => { d.fly.remove(); d.from.style.visibility = ""; }, 240);
}

/* ── finish, board, voice ─────────────────────────────────────────────── */
function finish() {
  running = false; clearInterval(tick);
  const secs = Math.round((Date.now() - t0) / 1000);
  $("done-h").textContent = lv.caps ? "States and capitals, all placed." : "All fifty placed.";
  $("finaltime").textContent = mmss(secs);
  const best = read()[0];
  $("verdict").textContent = !best ? "First time on the board."
    : secs < best.s ? "A new record. The old one was " + mmss(best.s) + "."
    : "The record is " + mmss(best.s) + ", by " + best.n + ".";
  $("done-v").dataset.secs = secs;
  $("done-v").classList.remove("hide");
  map.style.cursor = "pointer";
  $("hint").textContent = "Tap any state to hear what it is called.";
  ini[0].focus();
}

/* once the run is over the map becomes the lesson */
map.addEventListener("click", (e) => {
  if (running) return;
  const p = e.target.closest("[data-n]");
  if (!p) return;
  const s = STATES.find(x => x.n === p.dataset.n);
  if (!s) return;
  say("<b>" + s.n + "</b> &middot; " + (s.k || s.c));
  speak(s.n + ", " + (s.k || "capital " + s.c) + ".");
});

const ini = [...document.querySelectorAll(".initials input")];
ini.forEach((b, i) => {
  b.addEventListener("input", () => {
    b.value = b.value.replace(/[^a-z]/ig, "").toUpperCase();
    if (b.value && ini[i + 1]) ini[i + 1].focus();
  });
  b.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && !b.value && ini[i - 1]) ini[i - 1].focus();
  });
});

/* ⚠️ localStorage: this DEVICE's board, not a shared one. A real leaderboard
   needs a backend the site does not have yet, and saying so beats implying a
   world ranking that does not exist. */
const read = () => { try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; }
  catch (e) { return []; } };
$("save").onclick = () => {
  const name = ini.map(b => b.value || "-").join("");
  const secs = +$("done-v").dataset.secs;
  const rows = read().concat([{ n: name, s: secs, d: Date.now() }])
    .sort((a, b) => a.s - b.s).slice(0, 10);
  try { localStorage.setItem(LB_KEY, JSON.stringify(rows)); } catch (e) {}
  $("done-v").classList.add("hide");
  ini.forEach(b => (b.value = ""));
  showBoard(name, secs);
};
function showBoard(hn, hs) {
  const rows = read();
  $("lb").innerHTML = rows.length
    ? rows.map((r, i) => '<tr class="' + (r.n === hn && r.s === hs ? "me" : "") + '"><td>' +
        (i + 1) + "</td><td>" + r.n + '</td><td class="t">' + mmss(r.s) + "</td></tr>").join("")
    : "<tr><td>Nobody has finished a run yet.</td></tr>";
  $("lb-v").classList.remove("hide");
}
$("board-btn").onclick = () => showBoard();
$("lb-close").onclick = () => $("lb-v").classList.add("hide");

/* voice starts OFF - Kolten found the default too robotic, and on most machines
   it is. When switched on, hunt for a natural voice before settling. */
let VOICE_OFF = true;
$("mute").onclick = () => {
  VOICE_OFF = !VOICE_OFF;
  $("mute").textContent = VOICE_OFF ? "Voice off" : "Voice on";
  $("mute").setAttribute("aria-pressed", String(VOICE_OFF));
  if (VOICE_OFF && window.speechSynthesis) speechSynthesis.cancel();
};
function speak(text) {
  if (VOICE_OFF || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 1.02;
    const all = speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
    const v = all.find(x => /natural|neural|online|aria|jenny|guy/i.test(x.name))
      || all.find(x => /google/i.test(x.name)) || all[0];
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

function star(cx, cy, r) {
  let p = "";
  for (let i = 0; i < 10; i++) {
    const a = (Math.PI / 5) * i - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    p += (i ? "L" : "M") + (cx + Math.cos(a) * rr).toFixed(2) + "," +
         (cy + Math.sin(a) * rr).toFixed(2);
  }
  return p + "Z";
}

let tT = 0;
function say(m) {
  const t = $("toast");
  t.innerHTML = m; t.classList.add("show");
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove("show"), 1400);
}

/* the piece is sized from the map, so it has to be redrawn when the map is */
let rz = 0;
addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(() => {
    if (!running || !current || phase !== 1) return;
    queue.unshift(current);
    deal();
  }, 200);
});
</script>
