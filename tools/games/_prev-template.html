<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Place the State — NexStudents</title>
<!--
  GENERATED by tools/games/build-states-game.js. Edit the TEMPLATE beside the
  builder, never this output. Shapes are CC0 US Census boundaries; the capital
  stars are projected to match them and verified at build time.

  THE GAME LOOP, per Paul 2026-08-27: press start, a random state drops onto a
  pile every couple of seconds, and you race the clock to clear it. The pile is
  the pressure - fall behind and it grows on you. Finish all fifty and your time
  goes on the board.
-->
<style>
  :root{
    --bg:#12161b; --panel:#1a2027; --line:#2b3540; --fg:#eef2f6; --dim:#93a1b0;
    --slot:#1f2937; --edge:#33414f; --ok:#4ade80; --warn:#f87171;
    --star:#facc15; --piece:#64748b;
    --NE:#5b9cf6; --MW:#43c98a; --S:#e8a33d; --W:#a884e8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body,svg,#pile,#stack,.piece,.card h2,.big,.stat,.clock{user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overscroll-behavior:none}
  body{background:var(--bg);color:var(--fg);
       font:16px/1.5 "Segoe UI",system-ui,sans-serif;
       display:flex;flex-direction:column;overflow:hidden}

  header{padding:10px 16px;flex:none;display:flex;align-items:center;gap:16px;
         border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:1rem;letter-spacing:-.02em;flex:none}
  .clock{font-variant-numeric:tabular-nums;font-weight:800;font-size:1.5rem;
         letter-spacing:-.02em;flex:none;min-width:5.2ch}
  .stat{color:var(--dim);font-size:.82rem;flex:none}
  .stat b{color:var(--fg);font-variant-numeric:tabular-nums}
  .spacer{flex:1}
  button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid var(--line);
         background:none;color:var(--dim);padding:5px 14px;font-size:.8rem}
  button:hover{color:var(--fg);border-color:var(--dim)}
  button.go{background:var(--ok);border-color:var(--ok);color:#08301a;font-weight:800;
            padding:7px 22px;font-size:.9rem}
  button.go:hover{filter:brightness(1.08);color:#08301a}

  #wrap{flex:1;min-height:0;display:flex}
  #board{flex:1;min-width:0;position:relative;touch-action:none}
  /* 🚨 SCOPED TO THE MAP. A bare svg{width:100%} also caught every piece in
     the pile and stretched it to whatever box it sat in - which is why the
     small states came out two and three times their map size however carefully
     the width was calculated. The piece SVGs keep the exact size they are
     given; the box around them may be larger, and that extra is hit area. */
  #map{width:100%;height:100%;display:block}
  .piece svg{width:auto;height:auto}

  #nation{fill:none;stroke:#3a4a5c;stroke-width:1.6;stroke-linejoin:round}
  .slot{fill:var(--slot);stroke:var(--edge);stroke-width:.7}
  .slot.hot{fill:#2c3f52;stroke:var(--ok);stroke-width:1.6}
  /* a placed state takes its region's colour - see patch-game3.js for why
      region rather than a random palette */
  .done{stroke:#0f141a;stroke-width:.8}
  .done.NE{fill:var(--NE)} .done.MW{fill:var(--MW)}
  .done.S{fill:var(--S)}   .done.W{fill:var(--W)}
  .lbl{stroke:#0f141a}
  .cap{fill:#101820;stroke:none;font-weight:600}
  .legend{display:flex;gap:10px;align-items:center;font-size:.72rem;color:var(--dim)}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;
            margin-right:4px;vertical-align:-1px}
  select{font:inherit;font-size:.8rem;background:#12171d;color:var(--fg);
         border:1px solid var(--line);border-radius:999px;padding:5px 10px}
  .lbl{fill:#fff;font-weight:700;text-anchor:middle;pointer-events:none;
       paint-order:stroke;stroke:#12161b;stroke-width:2.4px;stroke-linejoin:round}
  .cap{fill:#c8d4e2;text-anchor:middle;pointer-events:none;
       paint-order:stroke;stroke:#12161b;stroke-width:2px;stroke-linejoin:round}
  .star{fill:var(--star);pointer-events:none}

  /* ── THE PILE ──────────────────────────────────────────────────────────
     Paul: "the states stack on top of each other and you can add a bit of
     drop shadow possibly or edges so they still appear like they are and they
     are not just overlapping and you cannot see which one it is on the pile."
     So each piece gets a real shadow and a pale rim, and sits offset from the
     one beneath. Without the offset a stack of grey shapes is one grey blob. */
  #pile{flex:none;width:260px;background:var(--panel);border-left:1px solid var(--line);
        position:relative;overflow:hidden;touch-action:none}
  #pile h2{margin:0;padding:9px 12px 6px;font-size:.7rem;letter-spacing:.14em;
           text-transform:uppercase;color:var(--dim);font-weight:800;
           border-bottom:1px solid var(--line)}
  /* 🚨 touch-action:none and no text selection. Paul: "when we try to grab
     them somtimes you miss grabbing it and you just drag the screen", and
     "can we not add the hightlighted like we did with the hamburger icon that
     highlights the text of the states on accident". Missing a piece must do
     NOTHING, not pan the page or select the label underneath. */
  #stack{position:absolute;inset:34px 0 0 0;touch-action:none}
  .piece{position:absolute;touch-action:none;cursor:grab;
         will-change:transform;filter:drop-shadow(0 5px 9px rgba(0,0,0,.55));
         transition:transform .28s cubic-bezier(.2,.85,.3,1);
         display:grid;place-items:center;min-width:54px;min-height:54px}
  .piece svg{overflow:visible;pointer-events:none;flex:none}
  .piece path{fill:var(--piece);stroke:#cbd8e6;stroke-width:1.3;
              stroke-linejoin:round;vector-effect:non-scaling-stroke}
  .piece.top path{fill:#7e91a6;stroke:#fff}
  .piece:active{cursor:grabbing}
  .piece.drop{animation:drop .32s cubic-bezier(.2,.9,.3,1)}
  @keyframes drop{from{transform:translate(var(--tx),-120px) rotate(var(--rot)) scale(.8);opacity:0}}

  .flying{position:fixed;left:0;top:0;z-index:99;pointer-events:none;
          filter:drop-shadow(0 16px 28px rgba(0,0,0,.65));transition:none}
  .flying path{fill:#8fa4ba;stroke:#fff}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
         background:#1f2933;border:1px solid var(--line);padding:7px 15px;
         border-radius:999px;font-size:.84rem;opacity:0;transition:opacity .2s;
         pointer-events:none;white-space:nowrap;z-index:60}
  .toast.show{opacity:1}

  /* ── panels ───────────────────────────────────────────────────────────── */
  .veil{position:fixed;inset:0;background:rgba(10,13,17,.82);display:grid;
        place-items:center;z-index:80}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:26px 30px;max-width:390px;width:calc(100% - 40px);text-align:center}
  .card h2{margin:0 0 6px;font-size:1.25rem}
  .card p{margin:0 0 18px;color:var(--dim);font-size:.88rem}
  .big{font-size:2.6rem;font-weight:800;font-variant-numeric:tabular-nums;
       letter-spacing:-.03em;margin:6px 0 2px}
  .initials{display:flex;gap:8px;justify-content:center;margin:14px 0 18px}
  .initials input{width:54px;height:62px;text-align:center;font:800 2rem/1 inherit;
    text-transform:uppercase;background:#12171d;color:var(--fg);
    border:1px solid var(--line);border-radius:10px;caret-color:var(--ok)}
  .initials input:focus{outline:none;border-color:var(--ok)}
  table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:4px}
  td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left}
  td.t{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
  tr.me td{color:var(--ok)}
  .hide{display:none!important}
  @media(prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
  @media(max-width:900px){ #pile{width:210px} }
  @media(max-width:640px){ #pile{width:150px} }
</style>
</head>
<body>

<header>
  <h1>Place the State</h1>
  <span class="clock" id="clock">0:00</span>
  <span class="stat">placed <b id="got">0</b>/<b id="tot">0</b></span>
  <span class="stat">pile <b id="npile">0</b></span>
  <span class="spacer"></span>
  <select id="level" aria-label="Difficulty">
    <option value="easy">Easy &middot; outlines shown</option>
    <option value="normal" selected>Normal &middot; faster</option>
    <option value="hard">Hard &middot; no outlines</option>
  </select>
  <span class="legend" aria-hidden="true">
    <span><i style="background:var(--NE)"></i>NE</span>
    <span><i style="background:var(--MW)"></i>MW</span>
    <span><i style="background:var(--S)"></i>S</span>
    <span><i style="background:var(--W)"></i>W</span>
  </span>
  <button id="mute" type="button" aria-pressed="true">Voice off</button>
  <button id="board-btn" type="button">Leaderboard</button>
  <button class="go" id="start" type="button">Start</button>
</header>

<div id="wrap">
  <div id="board">
    <svg id="map" viewBox="0 0 975 610" preserveAspectRatio="xMidYMid meet">
      <path id="nation" d="__NATION__"></path>
      <g id="slots"></g>
      <g id="marks"></g>
    </svg>
  </div>
  <aside id="pile">
    <h2>The pile</h2>
    <div id="stack"></div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<!-- finish -->
<div class="veil hide" id="done-v">
  <div class="card">
    <h2>All fifty placed.</h2>
    <div class="big" id="finaltime">0:00</div>
    <p id="verdict">&nbsp;</p>
    <p style="margin:-8px 0 14px">Now tap any state to hear what it is called.</p>
    <div class="initials" id="ini">
      <input maxlength="1" aria-label="First initial">
      <input maxlength="1" aria-label="Second initial">
      <input maxlength="1" aria-label="Third initial">
    </div>
    <button class="go" id="save" type="button">Put me on the board</button>
  </div>
</div>

<!-- leaderboard -->
<div class="veil hide" id="lb-v">
  <div class="card">
    <h2>Leaderboard</h2>
    <p id="lb-note">Fastest times on this device.</p>
    <table id="lb"></table>
    <p></p>
    <button id="lb-close" type="button">Close</button>
  </div>
</div>

<script>
const STATES = __STATES__;

/* how often a new state lands on the pile. Lower = more pressure. */
const LEVELS = {
  easy:   { ms: 6500, outlines: true  },
  normal: { ms: 4000, outlines: true  },
  hard:   { ms: 3000, outlines: false },
};
let SPAWN_MS = LEVELS.normal.ms;
const LB_KEY = "ns:states:leaderboard";

const NS = "http://www.w3.org/2000/svg";
const el = (n, a) => { const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };
const $ = (id) => document.getElementById(id);

const map = $("map"), slotG = $("slots"), markG = $("marks"), stack = $("stack");
$("tot").textContent = STATES.length;

/* ⚠️ streak is declared HERE, with the rest of the run state, because
   reset() runs at load and touches it. Declared further down with the drag
   variables it sat in the temporal dead zone and reset() threw - which showed
   up as a map with no state outlines and a Start button that did nothing. */
let slots = {}, queue = [], got = 0, streak = 0, t0 = 0, tick = 0, spawn = 0, running = false;

/* ── setup ─────────────────────────────────────────────────────────────── */
function reset() {
  clearInterval(tick); clearInterval(spawn);
  slotG.textContent = ""; markG.textContent = ""; stack.textContent = "";
  slots = {}; got = 0; streak = 0; running = false;
  $("got").textContent = "0"; $("npile").textContent = "0"; $("clock").textContent = "0:00";
  const lv = LEVELS[$("level").value] || LEVELS.normal;
  SPAWN_MS = lv.ms;
  STATES.forEach(s => {
    const p = el("path", { d: s.d, class: "slot" });
    /* on hard the slot is invisible but still THERE - it has to be, because a
       placed state has to be able to fill it and the neighbours it reveals are
       the reward for getting one right */
    if (!lv.outlines) p.style.opacity = "0";
    slotG.appendChild(p); slots[s.n] = p;
  });
  /* completely random, as asked - a fresh shuffle every run */
  queue = STATES.slice().sort(() => Math.random() - 0.5);
}
reset();

function begin() {
  reset();
  running = true;
  t0 = Date.now();
  $("start").textContent = "Restart";
  tick = setInterval(() => {
    const s = Math.floor((Date.now() - t0) / 1000);
    $("clock").textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }, 200);
  drop();                                   /* one immediately, so it starts */
  spawn = setInterval(drop, SPAWN_MS);
}
$("start").onclick = begin;
$("level").onchange = () => { reset(); $("start").textContent = "Start"; };

/* ── the pile ──────────────────────────────────────────────────────────────
   Each piece sits a little below and beside the one under it, with a shadow
   and a pale rim. Offsetting matters more than the shadow: a stack of grey
   shapes drawn on the same spot is one grey blob no matter how it is lit. */
function drop() {
  const s = queue.shift();
  if (!s) { clearInterval(spawn); return; }
  const box = document.createElement("div");
  box.className = "piece drop";
  box.dataset.n = s.n;
  box.title = s.n;
  /* ONE scale for every state, so the piece is the size it will be on the map */
  const K = pieceScale();
  const w = (s.b[2] - s.b[0]) * K, h = (s.b[3] - s.b[1]) * K;
  box.style.width = w + "px";
  box.style.height = h + "px";
  /* size set in STYLE, not just the width/height attributes. An attribute is
     the weakest thing in the cascade and any stylesheet rule beats it - which
     is exactly how the pieces ended up stretched twice already. */
  const svg = el("svg", { viewBox: s.b[0] + " " + s.b[1] + " " +
    (s.b[2]-s.b[0]) + " " + (s.b[3]-s.b[1]) });
  svg.style.width = w + "px";
  svg.style.height = h + "px";
  svg.style.flex = "none";
  svg.appendChild(el("path", { d: s.d }));
  box.appendChild(svg);
  stack.appendChild(box);
  layout();
  setTimeout(() => box.classList.remove("drop"), 340);
}

/* the pile's scale: the widest state has to fit the panel with room to spare,
   and every other state is drawn at that same scale */
/* 🚨 A PIECE IS THE SIZE OF THE HOLE IT FILLS. Paul, 2026-08-28: "i just put
   mississippi and new york on and they are slightly smaller than the map." That
   was a real flaw. Pieces were scaled to fit the PILE, so they agreed with each
   other but not with the map - and a jigsaw piece that is not the size of its
   slot cannot be matched by eye, which is most of how you solve one.
   The scale is now the MAP own scale, read live. Not memoised: the map rescales
   whenever the window does, and a stale value puts the mismatch straight back. */
function pieceScale() {
  const r = map.getBoundingClientRect();
  const vb = map.viewBox.baseVal;
  return Math.min(r.width / vb.width, r.height / vb.height);
}

/* the pile has to keep up when the window changes size */
let rz = 0;
addEventListener("resize", () => {
  clearTimeout(rz);
  rz = setTimeout(() => {
    const K = pieceScale();
    [...stack.children].forEach(k => {
      const st = STATES.find(x => x.n === k.dataset.n);
      if (!st) return;
      const w = (st.b[2] - st.b[0]) * K, h = (st.b[3] - st.b[1]) * K;
      k.style.width = w + "px"; k.style.height = h + "px";
      const g = k.querySelector("svg");
      g.style.width = w + "px"; g.style.height = h + "px";
    });
    layout();
  }, 150);
});

function layout() {
  const kids = [...stack.children];
  /* 🚨 The spacing SHRINKS as the pile grows. At a fixed step a bad run runs
     straight off the bottom of the panel and the states you still owe are
     simply invisible - which is the one thing a pile must never do. This keeps
     the whole stack on screen however far behind you fall, and the newest stays
     on top where the hand expects it. */
  const H = stack.clientHeight || 400;
  const ph = kids.length ? kids[0].offsetHeight : 120;
  const step = kids.length > 1
    ? Math.max(9, Math.min(38, (H - ph - 8) / (kids.length - 1)))
    : 38;
  kids.forEach((k, i) => {
    /* wobble each one slightly so the pile looks thrown, not filed */
    const seed = (k.dataset.n.charCodeAt(0) * 7 + k.dataset.n.length * 13) % 100;
    const tx = 10 + (seed % 18) - 9;
    const ty = 6 + i * step;
    const rot = ((seed % 14) - 7) + "deg";
    k.style.setProperty("--tx", tx + "px");
    k.style.setProperty("--rot", rot);
    k.style.transform = "translate(" + tx + "px," + ty + "px) rotate(" + rot + ")";
    k.style.zIndex = i + 1;
    k.classList.toggle("top", i === kids.length - 1);
  });
  $("npile").textContent = kids.length;
  /* keep the newest in view when the pile runs deep */
  stack.scrollTop = stack.scrollHeight;
}

/* ── drag ──────────────────────────────────────────────────────────────────
   Pointer Events with capture, transform only, one paint per frame, and every
   rect measured once on grab. The drop is judged from the POINTERUP event, not
   from the last move we stored - a browser may coalesce that final move, and
   then a piece released dead on target is judged where it was a moment ago. */
let drag = null, raf = 0;

/* 🚨 SPEAKS THE NAME ON PLACEMENT. Paul: "maybe even after you place it the
   state says its name." Wrapped in every guard the site learned the hard way:
   the voice list is re-read at speak time because Android repopulates it and a
   voice held from page load silently stops matching, and lang is set alongside
   the voice because Android needs both. Silent everywhere it is unsupported. */
/* 🚨 STARTS OFF. Kolten, 2026-08-27: it "sounds too robotic". A default
   voice on Windows usually is. Off by default, and when it is switched on we
   look for a natural or neural voice by name before settling for the default -
   those are markedly better where they exist. */
let VOICE_OFF = true;
function speak(text) {
  if (VOICE_OFF || !window.speechSynthesis) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 1.02;
    const all = speechSynthesis.getVoices().filter(x => /^en/i.test(x.lang));
    const v = all.find(x => /natural|neural|online|aria|jenny|guy/i.test(x.name))
      || all.find(x => /google/i.test(x.name))
      || all.find(x => /en[-_]US/i.test(x.lang))
      || all[0];
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch (e) {}
}

stack.addEventListener("pointerdown", (e) => {
  const piece = e.target.closest(".piece");
  if (!piece || drag || !running) return;
  e.preventDefault();
  const r = piece.getBoundingClientRect();
  const fly = piece.cloneNode(true);
  fly.className = "piece flying";
  fly.style.width = r.width + "px";
  fly.style.height = r.height + "px";
  document.body.appendChild(fly);
  drag = { n: piece.dataset.n, from: piece, fly,
    dx: e.clientX - r.left, dy: e.clientY - r.top,
    x: r.left, y: r.top, w: r.width, h: r.height,
    mapRect: map.getBoundingClientRect(), vb: map.viewBox.baseVal };
  piece.style.visibility = "hidden";
  paint();
  stack.setPointerCapture(e.pointerId);
});

stack.addEventListener("pointermove", (e) => {
  if (!drag) return;
  drag.x = e.clientX - drag.dx; drag.y = e.clientY - drag.dy;
  if (!raf) raf = requestAnimationFrame(paint);
});

function paint() {
  raf = 0; if (!drag) return;
  drag.fly.style.transform = "translate3d(" + drag.x + "px," + drag.y + "px,0) scale(1.05)";
  const hit = hitState();
  for (const n in slots) slots[n].classList.toggle("hot", n === hit);
}

function toMap(cx, cy) {
  const r = drag.mapRect, vb = drag.vb;
  const k = Math.min(r.width / vb.width, r.height / vb.height);
  return [(cx - (r.left + (r.width - vb.width * k) / 2)) / k + vb.x,
          (cy - (r.top + (r.height - vb.height * k) / 2)) / k + vb.y];
}

/* the snap radius scales with the state, with a floor - a fixed radius makes
   Texas trivial and Rhode Island impossible */
function hitState() {
  const c = toMap(drag.x + drag.w / 2, drag.y + drag.h / 2);
  const s = STATES.find(x => x.n === drag.n);
  const w = s.b[2] - s.b[0], h = s.b[3] - s.b[1];
  /* generous on purpose - Paul asked for easier snapping, and a near miss on a
     small state is the difference between a child finishing and giving up */
  const tol = Math.max(46, Math.min(w, h) * 1.05);
  return Math.hypot(c[0] - s.m[0], c[1] - s.m[1]) <= tol ? s.n : null;
}

stack.addEventListener("pointerup", (e) => {
  if (!drag) return;
  drag.x = e.clientX - drag.dx; drag.y = e.clientY - drag.dy;
  const hit = hitState();
  const d = drag; drag = null;
  for (const n in slots) slots[n].classList.remove("hot");
  if (hit === d.n) land(d); else { streak = 0; goBack(d); }
});
stack.addEventListener("pointercancel", () => { if (drag) { goBack(drag); drag = null; } });

function land(d) {
  const s = STATES.find(x => x.n === d.n);
  const r = d.mapRect, vb = d.vb;
  const k = Math.min(r.width / vb.width, r.height / vb.height);
  const tx = r.left + (r.width - vb.width * k) / 2 + (s.m[0] - vb.x) * k - d.w / 2;
  const ty = r.top + (r.height - vb.height * k) / 2 + (s.m[1] - vb.y) * k - d.h / 2;
  d.fly.style.transition = "transform .2s cubic-bezier(.2,.8,.3,1), opacity .2s .05s";
  d.fly.style.transform = "translate3d(" + tx + "px," + ty + "px,0) scale(1)";
  d.fly.style.opacity = "0";
  setTimeout(() => d.fly.remove(), 280);
  d.from.remove(); layout();
  slots[s.n].setAttribute("class", "done " + (s.r || ""));
  slots[s.n].style.opacity = "";

  const w = s.b[2] - s.b[0], h = s.b[3] - s.b[1];
  const size = Math.max(6, Math.min(13, Math.min(w, h) * 0.30));
  markG.appendChild(el("path", { class: "star", d: star(s.s[0], s.s[1], size * 0.45) }));
  const t1 = el("text", { class: "lbl", x: s.m[0], y: s.m[1] - 1, "font-size": size });
  t1.textContent = s.n;
  const t2 = el("text", { class: "cap", x: s.m[0], y: s.m[1] + size * 1.05,
    "font-size": size * 0.78 });
  t2.textContent = s.c;
  markG.appendChild(t1); markG.appendChild(t2);

  got++; $("got").textContent = got;
  slots[s.n].dataset.n = s.n;
  say("<b>" + s.n + "</b> &middot; " + s.c);
  speak(s.n + ". Capital, " + s.c + ".");
  streak++;
  if (streak >= 3) say("<b>" + s.n + "</b> &middot; " + streak + " in a row");
  if (got === STATES.length) { map.style.cursor = "pointer"; finish(); }
}

function goBack(d) {
  const r = d.from.getBoundingClientRect();
  d.fly.style.transition = "transform .24s cubic-bezier(.3,.9,.3,1)";
  d.fly.style.transform = "translate3d(" + r.left + "px," + r.top + "px,0) scale(1)";
  setTimeout(() => { d.fly.remove(); d.from.style.visibility = ""; }, 260);
}

/* ── finish and the board ─────────────────────────────────────────────────*/
const mmss = (s) => Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");

function finish() {
  running = false;
  clearInterval(tick); clearInterval(spawn);
  const secs = Math.round((Date.now() - t0) / 1000);
  $("finaltime").textContent = mmss(secs);
  const best = read()[0];
  $("verdict").textContent = !best ? "First time on the board."
    : secs < best.s ? "A new record. The old one was " + mmss(best.s) + "."
    : "The record is " + mmss(best.s) + ", by " + best.n + ".";
  $("done-v").dataset.secs = secs;
  $("done-v").classList.remove("hide");
  ini[0].focus();
}

const ini = [...document.querySelectorAll(".initials input")];
ini.forEach((b, i) => {
  b.addEventListener("input", () => {
    b.value = b.value.replace(/[^a-z]/ig, "").toUpperCase();
    if (b.value && ini[i + 1]) ini[i + 1].focus();
  });
  b.addEventListener("keydown", (e) => {
    if (e.key === "Backspace" && !b.value && ini[i - 1]) ini[i - 1].focus();
  });
});

/* 🚨 The board is in localStorage, so it is this DEVICE's board and nobody
   else's. A shared one needs a backend the site does not have yet - accounts
   are on the roadmap. Saying "on this device" is better than implying a world
   ranking that does not exist. */
const read = () => { try { return JSON.parse(localStorage.getItem(LB_KEY)) || []; }
  catch (e) { return []; } };
const write = (rows) => { try { localStorage.setItem(LB_KEY, JSON.stringify(rows)); }
  catch (e) {} };

$("save").onclick = () => {
  const name = ini.map(b => b.value || "-").join("");
  const secs = +$("done-v").dataset.secs;
  const rows = read().concat([{ n: name, s: secs, d: Date.now() }])
    .sort((a, b) => a.s - b.s).slice(0, 10);
  write(rows);
  $("done-v").classList.add("hide");
  ini.forEach(b => b.value = "");
  showBoard(name, secs);
};

function showBoard(hiName, hiSecs) {
  const rows = read();
  $("lb").innerHTML = rows.length
    ? rows.map((r, i) => '<tr class="' + (r.n === hiName && r.s === hiSecs ? "me" : "") +
        '"><td>' + (i + 1) + "</td><td>" + r.n + '</td><td class="t">' + mmss(r.s) +
        "</td></tr>").join("")
    : '<tr><td>Nobody has finished a run yet.</td></tr>';
  $("lb-v").classList.remove("hide");
}
$("mute").onclick = () => {
  VOICE_OFF = !VOICE_OFF;
  $("mute").textContent = VOICE_OFF ? "Voice off" : "Voice on";
  $("mute").setAttribute("aria-pressed", String(VOICE_OFF));
  if (VOICE_OFF && window.speechSynthesis) speechSynthesis.cancel();
};
$("board-btn").onclick = () => showBoard();
$("lb-close").onclick = () => $("lb-v").classList.add("hide");

/* 🚨 AFTER THE RUN, THE MAP BECOMES THE LESSON. Paul: "after you get them all
   filled in you can click each one and they say their motto." Only once every
   state is down - during play a stray tap should never do anything. */
map.addEventListener("click", (e) => {
  if (got < STATES.length) return;
  const p = e.target.closest("[data-n]");
  if (!p) return;
  const s = STATES.find(x => x.n === p.dataset.n);
  if (!s) return;
  say("<b>" + s.n + "</b> &middot; " + (s.k || s.c));
  speak(s.n + ", " + (s.k || "capital " + s.c) + ".");
});

function star(cx, cy, r) {
  let p = "";
  for (let i = 0; i < 10; i++) {
    const a = (Math.PI / 5) * i - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    p += (i ? "L" : "M") + (cx + Math.cos(a) * rr).toFixed(2) + "," +
         (cy + Math.sin(a) * rr).toFixed(2);
  }
  return p + "Z";
}

let tT = 0;
function say(m) {
  const t = $("toast");
  t.innerHTML = m; t.classList.add("show");
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove("show"), 1400);
}
</script>
</body>
