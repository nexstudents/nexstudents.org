<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Place the State — drag prototype</title>
<!--
  PROTOTYPE. Eleven states, not fifty, and that is deliberate: this exists to
  settle how the DRAG FEELS before the full map goes in. Paul, 2026-08-27:
  "this is a drag and drop game. so make the drag system smooth."

  🚨 WHY THESE ELEVEN. Their real borders are straight lines of latitude and
  longitude, so the shapes here are geographically correct rather than traced
  by eye. Every point - outline AND capital - comes from the SAME transform,
  x = (lon + 125) * 14, y = (50 - lat) * 14, which is why the stars land where
  they should. That is the problem the full map has to solve too: state paths
  are easy to find, but a capital star is only right if it is projected the
  same way the outlines were.

  WHAT MAKES THE DRAG SMOOTH, since that was the ask:
   - Pointer Events with setPointerCapture. One code path for mouse, touch and
     pen, and the piece keeps receiving moves even when the finger outruns it.
   - The piece moves on `transform: translate3d`, never left/top, so it rides
     on the compositor instead of forcing layout every frame.
   - Moves are stored and applied once per animation frame. A finger fires
     pointermove far faster than the screen refreshes; painting each one is
     wasted work that shows up as lag.
   - Every rect is measured ONCE on pointerdown. Measuring during the drag is
     the classic stutter: each read forces the browser to flush layout.
   - touch-action:none on the pieces, so the browser stops trying to decide
     whether a drag is a scroll. That decision costs a visible delay.
   - The snap radius scales with the piece, so small states are as catchable as
     big ones - a fixed radius makes Rhode Island unplayable on a phone.
-->
<style>
  :root{
    --bg:#12161b; --panel:#1a2027; --line:#2b3540; --fg:#eef2f6; --dim:#93a1b0;
    --slot:#243040; --ok:#4ade80; --star:#facc15; --piece:#5b6b7d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--fg);
       font:16px/1.5 "Segoe UI",system-ui,sans-serif;
       display:flex;flex-direction:column;overflow:hidden}
  header{padding:14px 18px 8px;flex:none}
  h1{margin:0;font-size:1.05rem;letter-spacing:-.02em}
  p.sub{margin:2px 0 0;color:var(--dim);font-size:.82rem}
  .score{float:right;font-weight:800;font-size:.9rem;color:var(--dim)}
  .score b{color:var(--ok)}

  #board{flex:1;min-height:0;position:relative;touch-action:none}
  svg{width:100%;height:100%;display:block}

  .slot{fill:var(--slot);stroke:#33414f;stroke-width:1.5;stroke-dasharray:5 5}
  .slot.hot{fill:#2f4256;stroke:var(--ok);stroke-dasharray:none}
  .done{fill:#3b4a5c;stroke:#54677d;stroke-width:1.5}
  .lbl{fill:#fff;font-weight:800;text-anchor:middle;pointer-events:none}
  .cap{fill:#cbd6e2;text-anchor:middle;pointer-events:none}
  .star{fill:var(--star);pointer-events:none}

  /* the tray */
  #tray{flex:none;height:132px;background:var(--panel);border-top:1px solid var(--line);
        display:flex;gap:10px;align-items:center;padding:0 12px;overflow-x:auto;
        overflow-y:hidden;scrollbar-width:thin}
  .piece{flex:none;width:96px;height:96px;touch-action:none;cursor:grab;
         position:relative;will-change:transform}
  .piece svg{overflow:visible}
  .piece path{fill:var(--piece);stroke:#7d8fa3;stroke-width:2;
              stroke-linejoin:round;transition:fill .18s}
  .piece:active{cursor:grabbing}

  /* the piece while it is being dragged - lifted off the page */
  .flying{position:fixed;left:0;top:0;z-index:99;pointer-events:none;
          filter:drop-shadow(0 12px 22px rgba(0,0,0,.55))}
  .flying path{fill:#7f93a8;stroke:#cfe0f0}

  .toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);
         background:#1f2933;border:1px solid var(--line);padding:8px 16px;
         border-radius:999px;font-size:.85rem;opacity:0;transition:opacity .2s;
         pointer-events:none}
  .toast.show{opacity:1}
  @media(prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>

<header>
  <span class="score"><b id="got">0</b> / <span id="tot">0</span></span>
  <h1>Place the State</h1>
  <p class="sub">Drag each state into its outline. Get it right and it names itself.</p>
</header>

<div id="board">
  <svg id="map" viewBox="40 0 410 280" preserveAspectRatio="xMidYMid meet"></svg>
</div>

<div id="tray" aria-label="States still to place"></div>
<div class="toast" id="toast"></div>

<script>
/* ── the data ───────────────────────────────────────────────────────────────
   Outlines and capitals share one transform, so a star cannot drift from the
   shape it belongs to. lon/lat -> x = (lon+125)*14, y = (50-lat)*14 */
const P = (lon, lat) => [(lon + 125) * 14, (50 - lat) * 14];
const poly = (pts) => "M" + pts.map(p => P(p[0], p[1]).map(n => n.toFixed(1)).join(",")).join("L") + "Z";

const STATES = [
  { id:"CO", name:"Colorado",     cap:"Denver",        capAt:[-104.98,39.74],
    d: poly([[-109,41],[-102,41],[-102,37],[-109,37]]) },
  { id:"WY", name:"Wyoming",      cap:"Cheyenne",      capAt:[-104.80,41.14],
    d: poly([[-111,45],[-104,45],[-104,41],[-111,41]]) },
  { id:"UT", name:"Utah",         cap:"Salt Lake City",capAt:[-111.89,40.76],
    d: poly([[-114,42],[-111,42],[-111,41],[-109,41],[-109,37],[-114,37]]) },
  { id:"NM", name:"New Mexico",   cap:"Santa Fe",      capAt:[-105.94,35.69],
    d: poly([[-109,37],[-103,37],[-103,31.33],[-109,31.33]]) },
  { id:"AZ", name:"Arizona",      cap:"Phoenix",       capAt:[-112.07,33.45],
    d: poly([[-114.8,37],[-109,37],[-109,31.33],[-114.05,31.33],[-114.8,34.3]]) },
  { id:"NV", name:"Nevada",       cap:"Carson City",   capAt:[-119.75,39.16],
    d: poly([[-120,42],[-114,42],[-114,35],[-120,39]]) },
  { id:"KS", name:"Kansas",       cap:"Topeka",        capAt:[-95.69,39.05],
    d: poly([[-102,40],[-94.6,40],[-94.6,37],[-102,37]]) },
  { id:"NE", name:"Nebraska",     cap:"Lincoln",       capAt:[-96.68,40.81],
    d: poly([[-104,43],[-95.3,43],[-95.3,40],[-104,40]]) },
  { id:"SD", name:"South Dakota", cap:"Pierre",        capAt:[-100.35,44.37],
    d: poly([[-104,45.9],[-96.4,45.9],[-96.4,43],[-104,43]]) },
  { id:"ND", name:"North Dakota", cap:"Bismarck",      capAt:[-100.78,46.81],
    d: poly([[-104,49],[-96.6,49],[-96.6,45.9],[-104,45.9]]) },
  { id:"OK", name:"Oklahoma",     cap:"Oklahoma City", capAt:[-97.52,35.47],
    d: poly([[-103,37],[-94.4,37],[-94.4,33.6],[-100,33.6],[-100,36.5],[-103,36.5]]) },
];

const NS = "http://www.w3.org/2000/svg";
const el = (n, a) => { const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

const map = document.getElementById("map");
const tray = document.getElementById("tray");
const toast = document.getElementById("toast");
document.getElementById("tot").textContent = STATES.length;
let got = 0;

/* the empty outlines */
const slots = {};
STATES.forEach(s => {
  const p = el("path", { d: s.d, class: "slot", "data-slot": s.id });
  map.appendChild(p);
  slots[s.id] = p;
});

/* the pieces, shuffled */
const shuffled = STATES.slice().sort(() => Math.random() - 0.5);
shuffled.forEach(s => {
  const box = document.createElement("div");
  box.className = "piece";
  box.dataset.id = s.id;
  /* each piece is drawn in its own tight viewBox so a small state still fills
     its tile - otherwise Rhode Island is four pixels in the corner */
  const b = bboxOf(s.d);
  const pad = 6;
  const svg = el("svg", { viewBox: (b.x-pad)+" "+(b.y-pad)+" "+(b.w+pad*2)+" "+(b.h+pad*2) });
  svg.appendChild(el("path", { d: s.d }));
  box.appendChild(svg);
  box.title = s.name;
  tray.appendChild(box);
});

function bboxOf(d) {
  const nums = d.match(/-?\d+(\.\d+)?/g).map(Number);
  let xs = [], ys = [];
  for (let i = 0; i < nums.length; i += 2) { xs.push(nums[i]); ys.push(nums[i+1]); }
  const x = Math.min(...xs), y = Math.min(...ys);
  return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y };
}

/* ── the drag ───────────────────────────────────────────────────────────────
   Everything below is about frames. Measure once, move on transform, paint
   once per frame, and never let the browser wonder whether this is a scroll. */
let drag = null, raf = 0;

tray.addEventListener("pointerdown", (e) => {
  const piece = e.target.closest(".piece");
  if (!piece || drag) return;
  e.preventDefault();

  const r = piece.getBoundingClientRect();
  const fly = piece.cloneNode(true);
  fly.classList.add("flying");
  fly.style.width = r.width + "px";
  fly.style.height = r.height + "px";
  document.body.appendChild(fly);

  drag = {
    id: piece.dataset.id, from: piece, fly,
    dx: e.clientX - r.left, dy: e.clientY - r.top,
    x: r.left, y: r.top,
    /* measured ONCE - reading these mid-drag is what makes a drag stutter */
    mapRect: map.getBoundingClientRect(),
    vb: map.viewBox.baseVal,
    w: r.width, h: r.height,
  };
  piece.style.visibility = "hidden";
  paint();
  tray.setPointerCapture(e.pointerId);
});

tray.addEventListener("pointermove", (e) => {
  if (!drag) return;
  drag.x = e.clientX - drag.dx;
  drag.y = e.clientY - drag.dy;
  if (!raf) raf = requestAnimationFrame(paint);   /* one paint per frame, not per event */
});

function paint() {
  raf = 0;
  if (!drag) return;
  drag.fly.style.transform =
    "translate3d(" + drag.x + "px," + drag.y + "px,0) scale(1.08)";
  const hit = hitSlot();
  for (const id in slots) slots[id].classList.toggle("hot", id === hit && id === drag.id);
}

/* screen point -> map coordinates, using the rect captured at pointerdown */
function toMap(cx, cy) {
  const r = drag.mapRect, vb = drag.vb;
  const scale = Math.min(r.width / vb.width, r.height / vb.height);
  const ox = r.left + (r.width - vb.width * scale) / 2;
  const oy = r.top + (r.height - vb.height * scale) / 2;
  return { x: (cx - ox) / scale + vb.x, y: (cy - oy) / scale + vb.y };
}

function hitSlot() {
  const c = toMap(drag.x + drag.w / 2, drag.y + drag.h / 2);
  const s = STATES.find(s => s.id === drag.id);
  const b = bboxOf(s.d);
  /* 🚨 tolerance scales with the piece. A fixed radius makes a big state
     trivial and a small one impossible - the opposite of what is wanted. */
  const tol = Math.max(18, Math.min(b.w, b.h) * 0.65);
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  return Math.hypot(c.x - cx, c.y - cy) <= tol ? s.id : null;
}

tray.addEventListener("pointerup", (e) => {
  if (!drag) return;
  const hit = hitSlot();
  const d = drag; drag = null;
  for (const id in slots) slots[id].classList.remove("hot");

  if (hit === d.id) { land(d); }
  else { returnHome(d); }
});
tray.addEventListener("pointercancel", () => { if (drag) { returnHome(drag); drag = null; } });

/* correct: the piece flies to its slot, then the slot fills and names itself */
function land(d) {
  const s = STATES.find(x => x.id === d.id);
  const b = bboxOf(s.d);
  const r = d.mapRect, vb = d.vb;
  const scale = Math.min(r.width / vb.width, r.height / vb.height);
  const ox = r.left + (r.width - vb.width * scale) / 2;
  const oy = r.top + (r.height - vb.height * scale) / 2;
  const tx = ox + (b.x + b.w / 2 - vb.x) * scale - d.w / 2;
  const ty = oy + (b.y + b.h / 2 - vb.y) * scale - d.h / 2;

  d.fly.style.transition = "transform .22s cubic-bezier(.2,.8,.3,1), opacity .22s .06s";
  d.fly.style.transform = "translate3d(" + tx + "px," + ty + "px,0) scale(1)";
  d.fly.style.opacity = "0";
  setTimeout(() => d.fly.remove(), 300);

  d.from.remove();
  slots[s.id].setAttribute("class", "done");

  const cap = P(s.capAt[0], s.capAt[1]);
  const size = Math.max(7, Math.min(b.w, b.h) * 0.22);
  map.appendChild(el("path", { class: "star", d: starPath(cap[0], cap[1], size * 0.42) }));
  const t1 = el("text", { class: "lbl", x: b.x + b.w / 2, y: b.y + b.h / 2 - 2,
    "font-size": size });
  t1.textContent = s.name;
  const t2 = el("text", { class: "cap", x: b.x + b.w / 2, y: b.y + b.h / 2 + size * 0.95,
    "font-size": size * 0.72 });
  t2.textContent = s.cap;
  map.appendChild(t1); map.appendChild(t2);

  got++; document.getElementById("got").textContent = got;
  say(s.cap + " is the capital of " + s.name);
  if (got === STATES.length) say("Every one placed. Well done.");
}

/* wrong: it goes back, and nothing scolds anybody */
function returnHome(d) {
  const r = d.from.getBoundingClientRect();
  d.fly.style.transition = "transform .26s cubic-bezier(.3,.9,.3,1)";
  d.fly.style.transform = "translate3d(" + r.left + "px," + r.top + "px,0) scale(1)";
  setTimeout(() => { d.fly.remove(); d.from.style.visibility = ""; }, 280);
}

function starPath(cx, cy, r) {
  let p = "";
  for (let i = 0; i < 10; i++) {
    const a = (Math.PI / 5) * i - Math.PI / 2;
    const rr = i % 2 ? r * 0.45 : r;
    p += (i ? "L" : "M") + (cx + Math.cos(a) * rr).toFixed(2) + "," +
         (cy + Math.sin(a) * rr).toFixed(2);
  }
  return p + "Z";
}

let toastT = 0;
function say(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(toastT);
  toastT = setTimeout(() => toast.classList.remove("show"), 1800);
}
</script>
</body>
</html>
